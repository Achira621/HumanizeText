<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background rounded squircle for app icon -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FEFA"/>
      <stop offset="100%" stop-color="#E2FBEF"/>
    </linearGradient>

    <!-- Stem Ribbon Gradient: Mint Green to Deep Green -->
    <linearGradient id="stemGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#145A40" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0F3D2E"/>
    </linearGradient>

    <!-- Arch Ribbon Gradient: Translucent Mint to Forest Green -->
    <linearGradient id="archGrad" x1="10%" y1="20%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.92"/>
      <stop offset="85%" stop-color="#196347" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0F3D2E"/>
    </linearGradient>

    <!-- Floating Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#0F3D2E"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F3D2E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="120" height="120" rx="28" fill="url(#iconBg)"/>

  <!-- Logo Group with soft shadow -->
  <g filter="url(#softGlow)" transform="translate(14, 12) scale(0.78)">
    <!-- Left Stem: Flowing organic ribbon -->
    <path
      d="M26,18 C33,18 40,24 40,34 L40,82 C40,94 33,102 24,102 C16,102 10,95 10,84 L10,34 C10,23 17,18 26,18 Z"
      fill="url(#stemGrad)"
    />

    <!-- Overlapping Arch with organic curve -->
    <path
      d="M36,48 C42,40 54,36 67,36 C82,36 94,46 94,62 L94,84 C94,95 87,102 78,102 C69,102 64,95 64,84 L64,65 C64,56 58,50 49,50 C44,50 39,53 36,58 Z"
      fill="url(#archGrad)"
      style="mix-blend-mode: multiply;"
    />

    <!-- Floating Circular Dot -->
    <circle cx="86" cy="22" r="10" fill="url(#dotGrad)"/>
  </g>
</svg>